# Behavioral evals for the cleanshotx skill.
#
# Each case loads cleanshotx/SKILL.md as the system prompt (via build_prompt.js)
# and asserts that the model's reply respects the skill's rules: emits valid
# cleanshot:// URLs, URL-encodes filepaths, refuses to invent missing commands,
# and applies the lower-left coordinate origin and version-gating gotchas.

- description: capture-area + clipboard returns a valid cleanshot:// URL
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Give me the exact one-line shell command to capture a screen area with
      CleanShot X and copy the resulting image to the clipboard. No commentary,
      just the command.
  assert:
    - type: regex
      value: 'cleanshot://capture-area\?[^\s"''`]*action=copy'
    - type: contains
      value: open

- description: pin filepath is URL-encoded
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Show me the cleanshot:// URL to pin the image at
      ~/Desktop/My Screenshot.png on top of all windows. Output the URL only.
  assert:
    - type: regex
      value: 'cleanshot://pin\?filepath=[^\s"''`]*%20'
    - type: not-contains
      value: '~/Desktop'

- description: refuses to invent a stop-recording URL
  vars:
    skillDir: cleanshotx
    userPrompt: |
      How do I stop a screen recording programmatically via the cleanshot://
      URL scheme?
  assert:
    - type: llm-rubric
      value: |
        The response must clearly state that the cleanshot:// URL scheme has
        no documented stop-recording command and that the user must stop the
        recording via the menu-bar item, the floating control, or a keyboard
        shortcut. It must NOT *recommend* or *prescribe* a URL like
        cleanshot://stop-recording or cleanshot://record-screen?action=stop
        as a working solution — quoting such a URL while explaining that it
        does not exist is fine.

- description: states origin is lower-left for spatial parameters
  vars:
    skillDir: cleanshotx
    userPrompt: |
      For cleanshot://capture-area, where is the origin (0,0) of the x and y
      parameters located on the screen? Be specific.
  assert:
    - type: regex
      value: '[Ll]ower[- ]?[Ll]eft|[Bb]ottom[- ]?[Ll]eft'
    - type: llm-rubric
      value: |
        Response must affirm that CleanShot's coordinate origin (0,0) is at
        the lower-left (or bottom-left) corner of the screen, with y
        increasing upward. It must not assert that the origin is at the
        top-left corner of the CleanShot coordinate system. (Mentioning
        top-left as a contrast with another framework, e.g. "unlike UIKit's
        top-left convention", is acceptable.)

- description: action= requires CleanShot 4.7+
  vars:
    skillDir: cleanshotx
    userPrompt: |
      What is the minimum CleanShot X version that supports the action= URL
      parameter? Reply with just the version number.
  assert:
    - type: contains
      value: '4.7'
    - type: not-contains
      value: '3.5.1'

- description: capture-text without filepath opens an interactive selection
  vars:
    skillDir: cleanshotx
    userPrompt: |
      What does cleanshot://capture-text do if I omit the filepath parameter?
  assert:
    - type: llm-rubric
      value: |
        Response must say CleanShot opens an interactive area selection / OCRs
        a region selected by the user. It must NOT claim that the command
        silently OCRs the most recent screenshot, the clipboard image, or any
        other implicit input.

- description: action= is single-valued, not a chain
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Can I write cleanshot://capture-area?action=copy,upload to copy AND
      upload in one call?
  assert:
    - type: llm-rubric
      value: |
        Response must say no — action= takes exactly one of copy/save/annotate/
        upload/pin and cannot be chained or comma-separated. It should suggest
        running multiple URLs sequentially or using the post-capture UI.

- description: cites the cleanshotx skill explicitly when relevant
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I want to take a quick fullscreen screenshot from the terminal. Suggest
      a command.
  assert:
    - type: contains
      value: 'cleanshot://capture-fullscreen'

# Cases below target the transcript-observed failure mode where the agent
# activated cleanshotx, then bypassed CleanShot in favour of the native
# `screencapture` CLI for a "screenshot my <app> window" request. The skill
# must (a) own this workflow with a clear recipe, (b) explain the lower-left
# coordinate conversion needed when window bounds come from System Events,
# (c) say that capture-window is interactive only, and (d) explain how to
# discover the resulting file when action=save.

- description: screenshot a named app's window without user clicks — uses CleanShot, not screencapture
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Make a screenshot of my Ghostty window and save it to disk. CleanShot X
      4.7+ is installed. I do not want to click on a window or drag a region —
      this must be fully unattended. Show me the exact shell commands you
      would run.
  assert:
    - type: contains
      value: 'cleanshot://capture-area'
    - type: llm-rubric
      value: |
        The response must use cleanshot://capture-area with spatial parameters
        (x, y, width, height — and ideally display) computed from the Ghostty
        window's frame. It must explain how to obtain that frame from another
        tool (AppleScript / System Events / Quartz CGWindowList) and account
        for CleanShot's lower-left coordinate origin when the source bounds
        use a top-left origin (System Events does). It MUST NOT recommend the
        macOS native `screencapture` utility as the answer. It MUST NOT
        suggest cleanshot://capture-window for an unattended workflow,
        because that command requires the user to hover and click a window.

- description: converts System Events top-left bounds to CleanShot lower-left coords
  vars:
    skillDir: cleanshotx
    userPrompt: |
      System Events reports my window's frame on the main display as
      position=(0, 33), size=(1728, 1084). The display is 1728x1117 points.
      Give me the exact cleanshot://capture-area URL with x/y/width/height
      filled in, and show the conversion math.
  assert:
    - type: regex
      value: 'x=0[^a-zA-Z0-9]+y=0[^a-zA-Z0-9]+width=1728[^a-zA-Z0-9]+height=1084'
    - type: llm-rubric
      value: |
        The response must show the conversion from System Events' top-left
        origin to CleanShot's lower-left origin using the formula
        cs_y = display_height - (top_left_y + height) (or an equivalent
        derivation), and arrive at x=0, y=0, width=1728, height=1084 because
        1117 - (33 + 1084) = 0. The width and height are unchanged.

- description: capture-window is interactive — wrong tool for unattended automation
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Can I use cleanshot://capture-window to capture a specific window with
      no user interaction at all (no hover, no click, no key press)?
  assert:
    - type: llm-rubric
      value: |
        Response must say no. cleanshot://capture-window enters a window-
        selection mode where the user has to hover and click the window to
        capture it. For fully unattended capture of a known window, the
        response should redirect to cleanshot://capture-area with explicit
        x/y/width/height parameters (4.7+), with the bounds obtained from
        another macOS API (AppleScript / System Events / Quartz CGWindowList).

- description: URL has no return value — must inspect save folder or clipboard
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I just fired `open "cleanshot://capture-area?x=0&y=0&width=800&height=600&action=save"`.
      In a shell script, how do I get the absolute path of the file CleanShot
      just wrote? Be specific.
  assert:
    - type: llm-rubric
      value: |
        Response must explain that the cleanshot:// URL itself returns no
        path — the `open` command exits as soon as it hands off to
        LaunchServices. It must point the user at the configured save
        folder (CleanShot ▸ Settings ▸ Screenshots ▸ "Save to") and show a
        concrete way to find the newest file there (e.g. `ls -t | head -n1`,
        `find <save-dir> -newer <marker>`, fswatch, or polling). It may also
        note that switching to action=copy or action=upload puts the image
        or URL on the clipboard for `pbpaste`. It must NOT claim that `open`
        prints the path or that the URL produces one synchronously.

# Cases below target a second transcript-observed failure mode where the agent
# tried to script the unattended-window-capture recipe and ran into three
# real bugs in the SKILL.md text:
#   1) the `defaults read … CaptureFolder` lookup always errors and falls
#      back to ~/Desktop (the actual key is `exportPath`), so the
#      "find newest file" path always points at the wrong directory;
#   2) the SKILL.md mentioned `Quartz.CGWindowListCopyWindowInfo` (PyObjC) as
#      an alternative — agents tried `python3 -c "import Quartz, …"` which
#      fails with `ModuleNotFoundError: No module named 'Quartz'` on a stock
#      macOS install (PyObjC is not in the default python3);
#   3) when Quartz failed, agents improvised a display-height-in-points
#      from `system_profiler SPDisplaysDataType` by dividing the Retina
#      pixel resolution by 2, which silently breaks on non-default scaled
#      modes (e.g. "More Space" / "Larger Text") where points ≠ pixels/2.

- description: save-folder lookup uses CleanShot's real defaults key, not CaptureFolder
  vars:
    skillDir: cleanshotx
    userPrompt: |
      In a shell script, how do I read the absolute path of CleanShot X's
      currently configured save folder (the directory it writes captures
      into)? Use `defaults read` against `pl.maketheweb.cleanshotx`. Show
      the exact key.
  assert:
    - type: contains
      value: 'exportPath'
    - type: not-contains
      value: 'CaptureFolder'
    - type: llm-rubric
      value: |
        The response must read the `exportPath` default from the
        `pl.maketheweb.cleanshotx` domain. It must NOT recommend the
        `CaptureFolder` key — that key does not exist in CleanShot X's
        defaults and `defaults read` will error out and force a fallback
        to ~/Desktop, which is wrong for any user who has changed their
        CleanShot save folder. (`annotateLastSaveURL` is also acceptable
        as a recently-saved-file pointer.)

- description: display-height-in-points does not require Python's Quartz / PyObjC
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I'm on stock macOS — no extra Python packages installed, no PyObjC.
      In a single shell-only command, give me the height of the main
      display in points (not Retina pixels). I will paste it straight
      into a `cleanshot://capture-area` URL.
  assert:
    - type: not-contains
      value: 'import Quartz'
    - type: not-contains
      value: 'CGDisplayBounds'
    - type: llm-rubric
      value: |
        The command must work on a stock macOS install — i.e. it must NOT
        require `pip install pyobjc`, `import Quartz`, or any other
        non-default Python module. Acceptable approaches: AppleScript
        `tell application "Finder" to get bounds of window of desktop`
        (and parse the 4th field), JavaScript-for-Automation with
        NSScreen via `osascript -l JavaScript`, or a Swift one-liner. It
        must NOT compute the answer by dividing the Retina pixel
        resolution from `system_profiler SPDisplaysDataType` by 2 — that
        is wrong on scaled display modes.

- description: does not infer display points by halving Retina pixel resolution
  vars:
    skillDir: cleanshotx
    userPrompt: |
      My display reports `Resolution: 3456 x 2234 Retina` from
      `system_profiler SPDisplaysDataType`. I need the display height in
      *points* for a `cleanshot://capture-area` URL. What's the right way
      to get it? Be precise about whether dividing by 2 is reliable.
  assert:
    - type: not-contains
      value: '2234 / 2'
    - type: llm-rubric
      value: |
        The response must say that dividing the Retina pixel resolution by
        2 is NOT a reliable way to get the point dimensions, because
        macOS's "Display Resolution" setting can choose a scaled mode
        ("More Space", "Larger Text") in which the point dimensions are
        decoupled from the native pixel grid. It should redirect to a
        method that returns points directly: AppleScript
        (`Finder bounds of desktop window`), JavaScript-for-Automation
        with `NSScreen.frame`, or `system_profiler`'s `UI Looks like:`
        line if present. Mentioning that "/2" happens to be correct on
        the *default* mode is OK as long as the response makes clear it
        is not a general rule.

- description: unattended named-window recipe is self-contained and stock-macOS only
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Give me the FULL shell snippet to screenshot the front window of the
      app named "Ghostty" with CleanShot X 4.7+, save it to disk, and
      print the path of the resulting file. No clicks. Stock macOS only —
      I do not have PyObjC, pillow, or any other extra Python packages
      installed. I run zsh.
  assert:
    - type: contains
      value: 'cleanshot://capture-area'
    - type: not-contains
      value: 'import Quartz'
    - type: not-contains
      value: 'CaptureFolder'
    - type: llm-rubric
      value: |
        The snippet must (a) read the front window's bounds from System
        Events / AppleScript, (b) read the display height in points from
        a stock-macOS source (Finder bounds of desktop window OR JXA
        NSScreen.frame — NOT Python+Quartz, NOT pixel-resolution / 2),
        (c) flip the y origin with cs_y = display_height - top_y - height,
        (d) URL-encode any user-supplied paths, (e) fire
        `open "cleanshot://capture-area?…&action=save"`, and (f) recover
        the newly-written file by polling CleanShot's actual save folder
        (read via `defaults read pl.maketheweb.cleanshotx exportPath` —
        NOT `CaptureFolder`) for files newer than a marker timestamp.

# Cases below target a third transcript-observed failure mode where the
# agent captured the wrong window because it (a) hard-coded "Ghostty" as the
# target app instead of resolving the user's actual frontmost app and (b)
# did not raise the target window before firing the region capture, so
# whatever happened to be on top of the screen at capture time landed in
# the file (e.g. Slack obscuring the agent's terminal).

- description: '"this window" resolves the frontmost app, not a hardcoded terminal name'
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Inside an agent that's running in some macOS terminal (could be
      Ghostty, iTerm2, Terminal.app, Wezterm, Alacritty, Kitty — agent
      should not assume), the user typed "make a screenshot of this
      window". Give me the AppleScript that resolves the target window
      so I can pass its bounds to cleanshot://capture-area.
  assert:
    - type: not-contains
      value: 'process "Ghostty"'
    - type: not-contains
      value: 'process "iTerm2"'
    - type: llm-rubric
      value: |
        The AppleScript must resolve the target window dynamically by
        finding the frontmost application process (e.g.
        `first application process whose frontmost is true`) and taking
        `window 1` of *that* process. It must NOT hard-code a specific
        terminal application name (`process "Ghostty"`, `process "iTerm2"`,
        `process "Terminal"`, etc.). Skipping menu-bar-only apps that
        have no windows is a plus but not required.

- description: raises target window before capture so occluding apps don't land in the file
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I'm running a recipe that uses cleanshot://capture-area with x/y/
      width/height computed from a target window's bounds. Sometimes the
      resulting screenshot shows a *different* app's window because that
      app was on top of my target at capture time. Why, and how do I fix
      it inside the recipe?
  assert:
    - type: llm-rubric
      value: |
        Response must explain that cleanshot://capture-area captures the
        pixels currently visible at the given screen rectangle, regardless
        of which window logically "owns" those coordinates — so any app
        layered on top of the target window will appear in the screenshot.
        The fix must be to *raise* (bring to front) the target window
        before firing the URL, e.g. by `set frontmost of <process> to true`
        and/or `perform action "AXRaise" of <window>` via System Events,
        followed by a brief `delay` so the raise actually takes effect
        before the capture. It must NOT recommend `screencapture -l
        <windowID>` as the primary fix — that bypasses CleanShot and
        produces a file outside CleanShot's pipeline. Mentioning it as a
        last-resort fallback when CleanShot is unavailable is fine.

- description: documents the multi-tab/multi-window-same-app limitation
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I run an agent inside one tab of a multi-tab Ghostty window, and the
      same Ghostty app has another window with several other tabs. If the
      agent runs the standard "screenshot the frontmost app's window 1"
      recipe, will it always capture the agent's own tab? Be honest about
      the failure modes.
  assert:
    - type: llm-rubric
      value: |
        Response must say no — System Events does not expose tabs or per-
        TTY window mappings to AppleScript, so `window 1 of process X`
        resolves to the application's most-recently-active *window*
        (and the currently-active tab inside that window), which may not
        be the agent's host tab. It should at minimum acknowledge that
        OSC title-marker injection is unreliable in practice (the running
        process — Claude Code, shell prompt — re-sets the title and
        overwrites the marker faster than System Events can read it).
        Acceptable mitigations: (a) the user explicitly names the
        target app or activates the right window first; (b) running the
        agent in a single-window terminal session.
