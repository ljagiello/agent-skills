# Behavioral evals for the cleanshotx skill.
#
# Each case loads cleanshotx/SKILL.md as the system prompt (via build_prompt.js)
# and asserts that the model's reply respects the skill's rules: emits valid
# cleanshot:// URLs, URL-encodes filepaths, refuses to invent missing commands,
# and applies the lower-left coordinate origin and version-gating gotchas.

- description: capture-area + clipboard returns a valid cleanshot:// URL
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Give me the exact one-line shell command to capture a screen area with
      CleanShot X and copy the resulting image to the clipboard. No commentary,
      just the command.
  assert:
    - type: regex
      value: 'cleanshot://capture-area\?[^\s"''`]*action=copy'
    - type: contains
      value: open

- description: pin filepath is URL-encoded
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Show me the cleanshot:// URL to pin the image at
      ~/Desktop/My Screenshot.png on top of all windows. Output the URL only.
  assert:
    - type: regex
      value: 'cleanshot://pin\?filepath=[^\s"''`]*%20'
    - type: not-contains
      value: '~/Desktop'

- description: refuses to invent a stop-recording URL
  vars:
    skillDir: cleanshotx
    userPrompt: |
      How do I stop a screen recording programmatically via the cleanshot://
      URL scheme?
  assert:
    - type: llm-rubric
      value: |
        The response must clearly state that the cleanshot:// URL scheme has
        no documented stop-recording command and that the user must stop the
        recording via the menu-bar item, the floating control, or a keyboard
        shortcut. It must NOT *recommend* or *prescribe* a URL like
        cleanshot://stop-recording or cleanshot://record-screen?action=stop
        as a working solution — quoting such a URL while explaining that it
        does not exist is fine.

- description: states origin is lower-left for spatial parameters
  vars:
    skillDir: cleanshotx
    userPrompt: |
      For cleanshot://capture-area, where is the origin (0,0) of the x and y
      parameters located on the screen? Be specific.
  assert:
    - type: regex
      value: '[Ll]ower[- ]?[Ll]eft|[Bb]ottom[- ]?[Ll]eft'
    - type: llm-rubric
      value: |
        Response must affirm that CleanShot's coordinate origin (0,0) is at
        the lower-left (or bottom-left) corner of the screen, with y
        increasing upward. It must not assert that the origin is at the
        top-left corner of the CleanShot coordinate system. (Mentioning
        top-left as a contrast with another framework, e.g. "unlike UIKit's
        top-left convention", is acceptable.)

- description: action= requires CleanShot 4.7+
  vars:
    skillDir: cleanshotx
    userPrompt: |
      What is the minimum CleanShot X version that supports the action= URL
      parameter? Reply with just the version number.
  assert:
    - type: contains
      value: '4.7'
    - type: not-contains
      value: '3.5.1'

- description: capture-text without filepath opens an interactive selection
  vars:
    skillDir: cleanshotx
    userPrompt: |
      What does cleanshot://capture-text do if I omit the filepath parameter?
  assert:
    - type: llm-rubric
      value: |
        Response must say CleanShot opens an interactive area selection / OCRs
        a region selected by the user. It must NOT claim that the command
        silently OCRs the most recent screenshot, the clipboard image, or any
        other implicit input.

- description: action= is single-valued, not a chain
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Can I write cleanshot://capture-area?action=copy,upload to copy AND
      upload in one call?
  assert:
    - type: llm-rubric
      value: |
        Response must say no — action= takes exactly one of copy/save/annotate/
        upload/pin and cannot be chained or comma-separated. It should suggest
        running multiple URLs sequentially or using the post-capture UI.

- description: cites the cleanshotx skill explicitly when relevant
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I want to take a quick fullscreen screenshot from the terminal. Suggest
      a command.
  assert:
    - type: contains
      value: 'cleanshot://capture-fullscreen'

# Cases below target the transcript-observed failure mode where the agent
# activated cleanshotx, then bypassed CleanShot in favour of the native
# `screencapture` CLI for a "screenshot my <app> window" request. The skill
# must (a) own this workflow with a clear recipe, (b) explain the lower-left
# coordinate conversion needed when window bounds come from System Events,
# (c) say that capture-window is interactive only, and (d) explain how to
# discover the resulting file when action=save.

- description: screenshot a named app's window without user clicks — uses CleanShot, not screencapture
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Make a screenshot of my Ghostty window and save it to disk. CleanShot X
      4.7+ is installed. I do not want to click on a window or drag a region —
      this must be fully unattended. Show me the exact shell commands you
      would run.
  assert:
    - type: contains
      value: 'cleanshot://capture-area'
    - type: llm-rubric
      value: |
        The response must use cleanshot://capture-area with spatial parameters
        (x, y, width, height — and ideally display) computed from the Ghostty
        window's frame. It must explain how to obtain that frame from another
        tool (AppleScript / System Events / Quartz CGWindowList) and account
        for CleanShot's lower-left coordinate origin when the source bounds
        use a top-left origin (System Events does). It MUST NOT recommend the
        macOS native `screencapture` utility as the answer. It MUST NOT
        suggest cleanshot://capture-window for an unattended workflow,
        because that command requires the user to hover and click a window.

- description: converts System Events top-left bounds to CleanShot lower-left coords
  vars:
    skillDir: cleanshotx
    userPrompt: |
      System Events reports my window's frame on the main display as
      position=(0, 33), size=(1728, 1084). The display is 1728x1117 points.
      Give me the exact cleanshot://capture-area URL with x/y/width/height
      filled in, and show the conversion math.
  assert:
    - type: regex
      value: 'x=0[^a-zA-Z0-9]+y=0[^a-zA-Z0-9]+width=1728[^a-zA-Z0-9]+height=1084'
    - type: llm-rubric
      value: |
        The response must show the conversion from System Events' top-left
        origin to CleanShot's lower-left origin using the formula
        cs_y = display_height - (top_left_y + height) (or an equivalent
        derivation), and arrive at x=0, y=0, width=1728, height=1084 because
        1117 - (33 + 1084) = 0. The width and height are unchanged.

- description: capture-window is interactive — wrong tool for unattended automation
  vars:
    skillDir: cleanshotx
    userPrompt: |
      Can I use cleanshot://capture-window to capture a specific window with
      no user interaction at all (no hover, no click, no key press)?
  assert:
    - type: llm-rubric
      value: |
        Response must say no. cleanshot://capture-window enters a window-
        selection mode where the user has to hover and click the window to
        capture it. For fully unattended capture of a known window, the
        response should redirect to cleanshot://capture-area with explicit
        x/y/width/height parameters (4.7+), with the bounds obtained from
        another macOS API (AppleScript / System Events / Quartz CGWindowList).

- description: URL has no return value — must inspect save folder or clipboard
  vars:
    skillDir: cleanshotx
    userPrompt: |
      I just fired `open "cleanshot://capture-area?x=0&y=0&width=800&height=600&action=save"`.
      In a shell script, how do I get the absolute path of the file CleanShot
      just wrote? Be specific.
  assert:
    - type: llm-rubric
      value: |
        Response must explain that the cleanshot:// URL itself returns no
        path — the `open` command exits as soon as it hands off to
        LaunchServices. It must point the user at the configured save
        folder (CleanShot ▸ Settings ▸ Screenshots ▸ "Save to") and show a
        concrete way to find the newest file there (e.g. `ls -t | head -n1`,
        `find <save-dir> -newer <marker>`, fswatch, or polling). It may also
        note that switching to action=copy or action=upload puts the image
        or URL on the clipboard for `pbpaste`. It must NOT claim that `open`
        prints the path or that the URL produces one synchronously.
