# Behavioral evals for the utmapp skill.
#
# Loads utmapp/SKILL.md as the system prompt and asserts that the model picks
# the right tool for each task, applies the documented gotchas (no auto-confirm
# on delete, Apple-backend limitations), and prefers the safer flag variants.

- description: start a VM uses utmctl start with quoted name
  vars:
    skillDir: utmapp
    userPrompt: |
      Give me the shell command to start a UTM VM named "Ubuntu Server".
      Output only the command.
  assert:
    - type: regex
      value: 'utmctl start ["\x27]Ubuntu Server["\x27]'

- description: delete warns about no confirmation prompt
  vars:
    skillDir: utmapp
    userPrompt: |
      Show me how to delete a UTM VM via utmctl. Mention any safety concerns.
  assert:
    - type: contains
      value: 'utmctl delete'
    - type: llm-rubric
      value: |
        Response must warn that utmctl delete has no confirmation prompt, and
        recommend listing VMs first (utmctl list) and/or backing up the .utm
        bundle before running it. The warning must be explicit, not implied.

- description: Apple Virtualization backend lacks scripted input
  vars:
    skillDir: utmapp
    userPrompt: |
      Can I use AppleScript "input keystroke" to send keys to a UTM VM running
      with the Apple Virtualization backend?
  assert:
    - type: llm-rubric
      value: |
        Response must say "no" — input keystroke (and other scripted input,
        USB connect/disconnect, QEMU guest-agent commands like exec/file/
        ip-address) is not supported on the Apple Virtualization backend, only
        on the QEMU backend. Must NOT claim Apple-backend VMs accept scripted
        keyboard input.

- description: explains stop, --request, and --kill correctly
  vars:
    skillDir: utmapp
    userPrompt: |
      What's the practical difference between `utmctl stop "VM"`,
      `utmctl stop "VM" --request`, and `utmctl stop "VM" --kill`? Which
      should I use first?
  assert:
    - type: llm-rubric
      value: |
        Response must correctly explain all three variants:
        - bare `stop` force-stops at the backend layer (default = --force).
        - `--request` asks the guest OS to power down cleanly.
        - `--kill` is a last-resort hard kill.
        It should also recommend trying --request first for a clean shutdown.

- description: exec/file/ip-address require the QEMU guest agent
  vars:
    skillDir: utmapp
    userPrompt: |
      I just ran `utmctl exec "Ubuntu" -- /bin/uname -a` against my Linux VM
      but it times out. What's the most likely cause and fix?
  assert:
    - type: llm-rubric
      value: |
        Response must identify the root cause as the QEMU guest agent not
        being installed/running inside the guest, and instruct the user to
        install qemu-guest-agent (or virtio-win Guest Tools on Windows) and
        enable the systemd service. Must NOT suggest unrelated fixes like
        SSH, network changes, or rebooting the host.

- description: duplicating a macOS guest must use AppleScript duplicate, not utmctl clone
  vars:
    skillDir: utmapp
    userPrompt: |
      I have a UTM VM called "macOS-base" running macOS on Apple Silicon (Apple
      Virtualization backend). I want to make a new test VM from it called
      "macOS-test". Give me the exact command(s) to run.
  assert:
    - type: llm-rubric
      value: |
        Response MUST recommend AppleScript `duplicate` (e.g.
        `osascript -e 'tell application "UTM" to duplicate virtual machine
        named "macOS-base" with properties {configuration:{name:"macOS-test"}}'`
        or an equivalent JXA snippet) for macOS Apple-backend guests, AND
        explicitly warn that `utmctl clone` produces two VMs sharing the same
        machine identity (AuxiliaryStorage / HardwareModel) which breaks Apple
        services such as iCloud / activation / FaceTime in the duplicate.
        The response must NOT recommend `utmctl clone` as the primary approach
        for a macOS guest. Pointing to `utmctl clone` only as a contrast /
        antipattern is acceptable.

- description: utmctl clone is fine for non-macOS guests
  vars:
    skillDir: utmapp
    userPrompt: |
      I have an Ubuntu UTM VM called "ubuntu-base". Give me the shell command
      to make a copy named "ubuntu-test". Output only the command.
  assert:
    - type: regex
      value: 'utmctl clone ["\x27]ubuntu-base["\x27].*--name ["\x27]ubuntu-test["\x27]'

- description: clone/duplicate names must include a unique identifier (timestamp/date)
  vars:
    skillDir: utmapp
    userPrompt: |
      I have a UTM VM called "ubuntu-base". I want to clone it. Suggest a
      name for the new VM and give me the command to create it. Don't ask
      me what to name it — just pick a sensible default.
  assert:
    - type: llm-rubric
      value: |
        The suggested clone name MUST include a unique identifier — a date
        (e.g. `2026-05-08`, `20260508`), a timestamp (e.g. `20260508-1530`),
        or an equivalent unique tag (UUID, build number, ISO date, `$(date
        +%Y%m%d)`). Plain bland names like "ubuntu-test", "ubuntu-clone",
        "ubuntu-copy", "ubuntu-base-2", or "ubuntu-base Clone" without any
        date/timestamp/ID component MUST fail this rubric. The rationale —
        avoiding collisions and being able to tell duplicates apart — should
        be at least implicitly visible (a dated name shows it).

- description: do not call utmctl ip-address on Apple-backend VMs — go straight to ARP/mDNS
  vars:
    skillDir: utmapp
    userPrompt: |
      I have a running UTM VM on the Apple Virtualization backend (macOS guest).
      How do I find its IP address from the host? Give me the exact commands
      to run.
  assert:
    - type: not-contains
      value: 'utmctl ip-address'
    - type: llm-rubric
      value: |
        Response MUST tell the user to skip `utmctl ip-address` entirely on
        Apple-backend VMs (it always fails with "Operation not supported by
        the backend" because there is no QEMU guest agent). It must NOT
        suggest running `utmctl ip-address` "just to try" or as a first step.
        Instead it MUST recommend reading the host ARP table (`arp -a`) on
        UTM's shared-network bridge interface (`bridge100`, subnet
        `192.168.64.0/24`) and/or mDNS lookup of `<hostname>.local`
        (`dscacheutil -q host -a name <hostname>.local`, `dns-sd -B
        _ssh._tcp local.`, or `ping -c1 <hostname>.local`). Hovering over
        the network icon in the UTM UI is also acceptable as a fallback.

- description: UTM shared-network bridge is bridge100 / 192.168.64.0/24
  vars:
    skillDir: utmapp
    userPrompt: |
      Which host interface and subnet does UTM use for its default Shared
      (NAT) network on macOS? I want to filter the ARP table to just the
      UTM guests. Output only the interface name and subnet.
  assert:
    - type: contains
      value: 'bridge100'
    - type: contains
      value: '192.168.64'

- description: filter ARP to UTM bridge, do not scan whole table
  vars:
    skillDir: utmapp
    userPrompt: |
      Give me a one-liner that lists every running UTM guest's IP from the
      host ARP table, scoped only to UTM's shared network. Output only the
      command.
  assert:
    - type: regex
      value: 'arp\s+(-[a-z]+\s+)*(-i\s+bridge100|bridge100)'
    - type: llm-rubric
      value: |
        The command MUST scope the ARP lookup to UTM's shared-network
        bridge interface `bridge100` (e.g. `arp -a -i bridge100`,
        `arp -an | grep bridge100`, or `arp -a -n | awk '/bridge100/'`).
        A bare `arp -a` with no scoping MUST fail this rubric — that returns
        every neighbor on every interface, which is what we are trying to
        avoid.

- description: utmctl start OSStatus -2700 is cosmetic — verify with status, do not retry
  vars:
    skillDir: utmapp
    userPrompt: |
      I just duplicated a macOS guest VM with AppleScript and ran:

          /Applications/UTM.app/Contents/MacOS/utmctl start "macOS-test-20260512-0042"

      utmctl printed:

          Error from event: The operation couldn't be completed. (OSStatus error -2700.)
          Operation not available.

      Did the start fail? What should I do next? Be specific about the
      command to run.
  assert:
    - type: llm-rubric
      value: |
        Response MUST explain that this `-2700 / Operation not available`
        from `utmctl start` on an Apple-backend VM is a known cosmetic
        AppleScript-bridge error and the VM very likely transitioned to
        `started` anyway. It MUST instruct the user to verify by running
        `utmctl status "<vm>"` (or `utmctl list`) and proceed if the
        status is `starting` or `started`. It MUST NOT recommend retrying
        `utmctl start`, deleting/recreating the VM, "fixing" the
        duplicate, reinstalling UTM, or treating the exit code as a hard
        failure. Mentioning that the same `-2700` code on `utmctl exec`
        / `utmctl ip-address` is genuinely fatal (Apple backend has no
        QEMU guest agent) is acceptable but not required.

- description: OSStatus -2700 is overloaded — disambiguate by command and trailing message
  vars:
    skillDir: utmapp
    userPrompt: |
      utmctl keeps printing "OSStatus error -2700" against my Apple-backend
      macOS guest, but for different commands. Sometimes the VM still works
      after, sometimes nothing happens. How do I tell whether a -2700 is
      cosmetic or a real failure? What signal should I check?
  assert:
    - type: llm-rubric
      value: |
        Response MUST explain that OSStatus -2700 is the generic
        AppleScript "event failed" envelope and the meaning is carried
        by (a) the trailing message line and (b) the command that
        produced it. It MUST give the user a concrete rule:
          - `utmctl start` + "Operation not available" on Apple backend
            → usually COSMETIC; verify VM state with `utmctl status`,
            proceed if `starting`/`started`.
          - `utmctl exec` / `utmctl file` / `utmctl ip-address` +
            "Operation not supported by the backend" on Apple backend
            → REAL; there is no QEMU guest agent on Apple
            Virtualization. Use SSH / ARP / mDNS instead.
        It MUST tell the user to check `utmctl status` (or `utmctl list`)
        as the source of truth, not the utmctl exit code or the error
        text alone. It MUST NOT claim every -2700 is harmless, nor that
        every -2700 is fatal.
